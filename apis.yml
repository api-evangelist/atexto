name: Atexto
description: >-
  Atexto was a speech-recognition data company (self-described "the accuracy platform for
  speech recognition") based in Mexico City, founded around 2016 by Brenda Mana Pastrian and
  Esteban Gorupicz. It helped machine-learning and voice-assistant teams create, collect,
  annotate, transcribe, and benchmark audio/speech datasets, combining an enterprise data
  platform with a global paid crowdsourcing community that transcribed and labeled audio
  across roughly 24 languages and their regional accents. The company also offered a hybrid
  human-plus-machine audio-to-text transcription service and ASR training-data services. It was
  backed by 500 Global, Redwood Ventures, MC Capital, and a Start-Up Chile grant. The company
  now appears inactive: its former domain atexto.com has been repurposed to an unrelated
  third-party site, and no live developer portal, API documentation, or machine-readable API
  specification could be located. This profile captures verified historical identity only; no
  API artifacts were enriched because no live API surface exists.
